<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<style>
@page {
    size: 860px 1216px;
    margin: 0;
}
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
}
.page {
    width: 860px;
    height: 1216px;
    page-break-after: always;
    page-break-inside: avoid;
    box-sizing: border-box;
    background-size: cover;
    background-position: center;
    position: relative;
    padding: 50px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.page-fem {
    background-image: url('fondo_femeninas_rosas.jpg');
}
.page-masc {
    background-image: url('fondo_masculinas_seda_azul.jpg');
}
.title {
    font-size: 42px;
    font-weight: bold;
    color: #fff;
    text-shadow: 0 0 15px rgba(255, 105, 180, 0.8), 2px 2px 4px #000;
    margin-bottom: 25px;
}
.title-masc {
    text-shadow: 0 0 15px rgba(30, 144, 255, 0.8), 2px 2px 4px #000;
}
.list-box {
    background: rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(4px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    padding: 20px 30px;
    width: 90%;
    color: #fff;
    font-size: 20px;
    line-height: 1.6;
}
</style>
</head>
<body>
<div class='page page-fem'>
    <div class='title'>Fragancias Femeninas</div>
    <div class='list-box'>
        <div><b>212 Glam</b> — Carolina Herrera</div>
        <div><b>212 Héroes</b> — Carolina Herrera</div>
        <div><b>212 New York</b> — Carolina Herrera</div>
    </div>
</div>
<div class='page page-masc'>
    <div class='title title-masc'>Fragancias Masculinas</div>
    <div class='list-box'>
        <div><b>212 Glam</b> — Carolina Herrera</div>
        <div><b>212 Heroes</b> — Carolina Herrera</div>
        <div><b>212 Vip Black</b> — Carolina Herrera</div>
    </div>
</div>
</body>
</html>
